apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-database
spec:
  podSelector:
    matchLabels: {app: "{{ .Release.Name }}-database"}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: "{{ .Release.Name }}-store"}
      ports: [{protocol: TCP, port: 3306}]

