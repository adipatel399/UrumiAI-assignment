# Replace hostname, image location, and TLS Secret before deploying.
store:
  host: store.example.com
  url: https://store.example.com
  image: ghcr.io/YOUR_ACCOUNT/urumi-store:0.1.0
  tlsSecret: urumi-store-tls
  contentSize: 10Gi
database:
  size: 10Gi
woocommerceMcp:
  enabled: true
  image: ghcr.io/YOUR_ACCOUNT/urumi-woocommerce-mcp:0.1.0
platform:
  enabled: true
  image: ghcr.io/YOUR_ACCOUNT/urumi-platform:0.1.0
  host: gateway.example.com
  url: https://gateway.example.com
  cookieSecure: true
  tlsSecret: urumi-gateway-tls
  databaseSize: 10Gi
# Optional managed stores: set apiServerCidr to the node's internal IP /32.
# Images above must also be available for managed namespaces.
provisioning:
  enabled: false
  baseDomain: stores.example.com
  publicPort: ""
  apiServerCidr: ""
  storageClass: local-path
  maxPerUser: 3
  maxTotal: 4
  timeoutSeconds: 900
