store:
  image: urumi-store:0.1.0
  imagePullPolicy: IfNotPresent
  host: store.localhost
  url: http://store.localhost:8080
  ingressClass: traefik
  tlsSecret: ""
  secretName: urumi-store-secrets
  storageClass: local-path
  contentSize: 2Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 768Mi}
database:
  image: mariadb:11.4@sha256:1292844148b311e4ed4300022a996d39083f415a963e970cf47cad1b3b18e3a6
  storageClass: local-path
  size: 2Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 768Mi}
woocommerceMcp:
  enabled: false
  image: urumi-woocommerce-mcp:0.1.0
  secretName: urumi-woocommerce-mcp-secrets
  timezone: Asia/Kolkata
  timeoutMs: 8000
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 192Mi}
platform:
  enabled: false
  image: urumi-platform:0.1.0
  host: gateway.localhost
  url: http://gateway.localhost:8080
  llmSecretName: urumi-llm-secrets
  cookieSecure: false
  tlsSecret: ""
  timeoutMs: 10000
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
  databaseImage: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
  databaseSize: 2Gi
  databaseStorageClass: local-path
