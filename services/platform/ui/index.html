<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Urumi Workspace</title>
    <style>
      body {
        margin: 0;
        background: #f4f6f8;
        color: #192331;
        font: 16px system-ui;
      }
      header {
        background: #152838;
        color: white;
        padding: 24px;
        display: flex;
        gap: 32px;
        align-items: center;
      }
      main {
        max-width: 1050px;
        margin: 40px auto;
        padding: 0 20px;
      }
      section,
      article {
        background: white;
        padding: 24px;
        border: 1px solid #dde4eb;
        border-radius: 12px;
        margin: 16px 0;
      }
      label {
        display: block;
        margin: 12px 0;
      }
      select {
        padding: 10px;
        border: 1px solid #abb8c5;
        border-radius: 6px;
      }
      nav button,
      h2 {
        text-transform: capitalize;
      }
      input {
        display: block;
        padding: 10px;
        width: min(90%, 450px);
        border: 1px solid #abb8c5;
        border-radius: 6px;
      }
      button {
        padding: 10px 18px;
        margin: 6px;
        border: 0;
        border-radius: 6px;
        background: #146b65;
        color: white;
        cursor: pointer;
      }
      nav button[aria-pressed="true"] {
        background: #152838;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-size: 13px;
      }
      aside {
        background: #edf8ee;
        padding: 16px;
      }
      [role="alert"] {
        background: #ffe5e5;
        padding: 16px;
      }
      textarea {
        display: block;
        width: 95%;
        min-height: 100px;
        padding: 12px;
        font: inherit;
        border: 1px solid #abb8c5;
        border-radius: 6px;
      }
      .check {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .check input {
        width: auto;
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      .chat article pre {
        font: inherit;
        white-space: pre-wrap;
      }
      .chat article {
        background: #f7fafb;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/app.js"></script>
  </body>
</html>
